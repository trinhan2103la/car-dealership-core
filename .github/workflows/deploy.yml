name: deploy

on:
    workflow_dispatch:
    push:
        branches: [main]

permissions:
    contents: read

concurrency:
    group: deploy-demo
    cancel-in-progress: false

jobs:
    migrate:
        runs-on: ubuntu-latest
        environment: demo
        env:
            ConnectionStrings__Default: ${{ secrets.DEMO_DB_CONNECTION }}
            SEED_SUPERADMIN_EMAIL: ${{ secrets.DEMO_SEED_SUPERADMIN_EMAIL }}
            SEED_SUPERADMIN_PASSWORD: ${{ secrets.DEMO_SEED_SUPERADMIN_PASSWORD }}
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: '10.0.x'
            - name: Kiểm tra secret bắt buộc đã được cấu hình
              run: |
                  missing=0
                  for v in DEMO_DB_CONNECTION DEMO_SEED_SUPERADMIN_EMAIL DEMO_SEED_SUPERADMIN_PASSWORD; do
                    if [ -z "${!v}" ]; then echo "::error::Thiếu secret: $v"; missing=1; fi
                  done
                  test "$missing" -eq 0
              env:
                  DEMO_DB_CONNECTION: ${{ secrets.DEMO_DB_CONNECTION }}
                  DEMO_SEED_SUPERADMIN_EMAIL: ${{ secrets.DEMO_SEED_SUPERADMIN_EMAIL }}
                  DEMO_SEED_SUPERADMIN_PASSWORD: ${{ secrets.DEMO_SEED_SUPERADMIN_PASSWORD }}
            - name: Restore
              run: dotnet restore CarDealership.CoreService.slnx
            - name: Build DbMigrator
              run: dotnet build src/CarDealership.CoreService.DbMigrator -c Release --no-restore
            - name: Chạy DbMigrator (migration + seed) trỏ Supabase
              run: dotnet run --project src/CarDealership.CoreService.DbMigrator -c Release --no-build
