name: ci

# Ngày 19 (ADR-011): CI riêng cho repo core-api. Chạy trên PR vào main và push lên main.
on:
    pull_request:
        branches: [main]
    push:
        branches: [main]

permissions:
    contents: read

jobs:
    # Build + test .NET. Cấp PostgreSQL service để EF Core/Host integration test chạy đầy đủ.
    dotnet-build-test:
        runs-on: ubuntu-latest
        services:
            postgres:
                image: postgres:18
                env:
                    POSTGRES_USER: cdp
                    POSTGRES_PASSWORD: cdp_dev_pw
                    POSTGRES_DB: cdp
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U cdp -d cdp"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10
        env:
            ConnectionStrings__Default: 'Host=localhost;Port=5432;Database=cdp;User ID=cdp;Password=cdp_dev_pw;'
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: '10.0.x'
            - name: Restore
              run: dotnet restore CarDealership.CoreService.slnx
            - name: Build
              run: dotnet build CarDealership.CoreService.slnx -c Release --no-restore
            - name: Test
              run: dotnet test CarDealership.CoreService.slnx -c Release --no-build --verbosity normal

    # Ngày 20 (Req 29.1–29.3): không có package .Pro./Commercial, mọi Volo.* nằm trong allowlist.
    check-abp-packages:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: '10.0.x'
            - name: Restore
              run: dotnet restore CarDealership.CoreService.slnx
            # Script phải bắt được fixture có Volo.Abp.Identity.Pro.Domain (exit 1) trước khi tin kết quả thật.
            - name: Self-test script bằng fixture
              run: bash deploy/scripts/test-check-abp-packages.sh
            - name: Check ABP package allowlist (solution thật)
              run: bash deploy/scripts/check-abp-packages.sh

    # Ngày 20 (Req 21): chặn secret lộ và lỗ hổng NuGet mức High/Critical.
    security:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pull-requests: read
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            # Repo thuộc tài khoản cá nhân nên gitleaks-action không cần license key.
            - name: Gitleaks
              uses: gitleaks/gitleaks-action@v2
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            - uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: '10.0.x'
            - name: Restore
              run: dotnet restore CarDealership.CoreService.slnx
            - name: NuGet vulnerabilities (chặn High/Critical)
              run: |
                  dotnet list CarDealership.CoreService.slnx package --vulnerable --include-transitive --format json > vuln.json
                  test -s vuln.json
                  if grep -E '"severity": *"(High|Critical)"' vuln.json; then
                    echo "::error::Co package NuGet dinh lo hong High/Critical (chi tiet o vuln.json ben duoi)."
                    cat vuln.json
                    exit 1
                  fi
                  echo "Khong co lo hong NuGet muc High/Critical."

    commitlint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
            - name: Install commitlint
              run: npm install --no-save @commitlint/cli @commitlint/config-conventional
            - name: Lint PR commits
              if: github.event_name == 'pull_request'
              run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}
